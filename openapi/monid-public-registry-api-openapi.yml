openapi: 3.2.0
info:
  title: Monid Public Registry API
  version: 0.1.0
  description: Agentic payment platform for data — agents discover and buy data on demand. Authenticated `/v1/*` routes accept a Monid API key or Clerk JWT as a Bearer token. All errors return `{ code, message }`. List endpoints use cursor pagination; consult each operation schema for its last-page cursor encoding.
servers:
- url: https://api.monid.ai
  description: Production
- url: https://monid.ai
  description: Public registry alias (public/v1 only)
tags:
- name: Public Registry
paths:
  /public/v1/stats:
    get:
      tags:
      - Public Registry
      summary: Catalog-wide aggregate counts
      description: Number of enabled endpoints and providers in the public catalog.
      parameters:
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
          description: 'Filter by static eligibility for x402 payment (`POST /x402/v1/run`): `true` keeps only payable endpoints, `false` only non-payable ones. Omit for all endpoints.'
        required: false
        description: 'Filter by static eligibility for x402 payment (`POST /x402/v1/run`): `true` keeps only payable endpoints, `false` only non-payable ones. Omit for all endpoints.'
        name: supportsX402
        in: query
      - schema:
          type: string
          minLength: 1
          maxLength: 100
          description: Narrow to endpoints payable via x402 on this customer-payment network (CAIP-2 id, e.g. `eip155:8453`). Implies `supportsX402=true`; an unknown/unconfigured id returns an empty page.
          example: eip155:8453
        required: false
        description: Narrow to endpoints payable via x402 on this customer-payment network (CAIP-2 id, e.g. `eip155:8453`). Implies `supportsX402=true`; an unknown/unconfigured id returns an empty page.
        name: x402Network
        in: query
      responses:
        '200':
          description: Aggregate counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicRegistryStats'
        '400':
          description: Bad request — input failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getPublicV1Stats
      x-operation-id-source: derived
  /public/v1/categories:
    get:
      tags:
      - Public Registry
      summary: List catalog categories
      description: Flat, id-based list of category nodes (top groups, leaf categories, provider nodes) with live endpoint counts and the exact catalog total. Use the returned `id` values with `GET /public/v1/endpoints?category=…` (+ optional `q=`).
      parameters:
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
          description: 'Filter by static eligibility for x402 payment (`POST /x402/v1/run`): `true` keeps only payable endpoints, `false` only non-payable ones. Omit for all endpoints.'
        required: false
        description: 'Filter by static eligibility for x402 payment (`POST /x402/v1/run`): `true` keeps only payable endpoints, `false` only non-payable ones. Omit for all endpoints.'
        name: supportsX402
        in: query
      - schema:
          type: string
          minLength: 1
          maxLength: 100
          description: Narrow to endpoints payable via x402 on this customer-payment network (CAIP-2 id, e.g. `eip155:8453`). Implies `supportsX402=true`; an unknown/unconfigured id returns an empty page.
          example: eip155:8453
        required: false
        description: Narrow to endpoints payable via x402 on this customer-payment network (CAIP-2 id, e.g. `eip155:8453`). Implies `supportsX402=true`; an unknown/unconfigured id returns an empty page.
        name: x402Network
        in: query
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
          description: 'Filter by whether running the endpoint can change your workspace resources (phone numbers, files, asset libraries): `true` keeps only endpoints that cannot create, modify or delete them, `false` only endpoints that can. Omit for all endpoints. This describes RESOURCE effects only — a readonly endpoint may still perform real-world actions and is still billed.'
        required: false
        description: 'Filter by whether running the endpoint can change your workspace resources (phone numbers, files, asset libraries): `true` keeps only endpoints that cannot create, modify or delete them, `false` only endpoints that can. Omit for all endpoints. This describes RESOURCE effects only — a readonly endpoint may still perform real-world actions and is still billed.'
        name: readonly
        in: query
      - schema:
          type: string
          description: 'Keep only endpoints whose run can have AT LEAST ONE of the named effects on your workspace resources (phone numbers, files, asset libraries): `creates`, `updates`, `deletes`. Omit for all endpoints. Takes precedence over `readonly` (`readonly=true` is the alias for "no write effects"). Resource effects only — an endpoint with no effect may still perform real-world actions and is still billed.'
          example: creates,deletes
        required: false
        description: 'Keep only endpoints whose run can have AT LEAST ONE of the named effects on your workspace resources (phone numbers, files, asset libraries): `creates`, `updates`, `deletes`. Omit for all endpoints. Takes precedence over `readonly` (`readonly=true` is the alias for "no write effects"). Resource effects only — an endpoint with no effect may still perform real-world actions and is still billed.'
        name: effects
        in: query
      - schema:
          type: string
          maxLength: 60
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Node id filter. A TOP id returns the top plus its member nodes; a leaf/provider id returns that single node. Omit for every node.
          example: social-media
        required: false
        description: Node id filter. A TOP id returns the top plus its member nodes; a leaf/provider id returns that single node. Omit for every node.
        name: category
        in: query
      - schema:
          type: string
          minLength: 1
          maxLength: 200
          description: Optional free-text query — counts become per-node search hit counts (same BM25 semantics as `GET /public/v1/endpoints?q=`). Nodes with zero hits are omitted.
          example: twitter
        required: false
        description: Optional free-text query — counts become per-node search hit counts (same BM25 semantics as `GET /public/v1/endpoints?q=`). Nodes with zero hits are omitted.
        name: q
        in: query
      responses:
        '200':
          description: Category nodes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCategoriesResponse'
        '400':
          description: Bad request — input failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getPublicV1Categories
      x-operation-id-source: derived
  /public/v1/endpoints:
    get:
      tags:
      - Public Registry
      summary: List or search endpoints
      description: Cursor-paginated flat list of endpoint cards. Pass `category` to narrow to a category node (ids from `GET /public/v1/categories`), `provider` to narrow to one provider's endpoints, and/or `q` for BM25 keyword ranking.
      parameters:
      - schema:
          type: integer
          exclusiveMinimum: 0
          description: Max items per page (server-side cap applies).
          example: 20
        required: false
        description: Max items per page (server-side cap applies).
        name: limit
        in: query
      - schema:
          type: string
          description: Cursor returned by the previous page.
        required: false
        description: Cursor returned by the previous page.
        name: cursor
        in: query
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
          description: 'Filter by static eligibility for x402 payment (`POST /x402/v1/run`): `true` keeps only payable endpoints, `false` only non-payable ones. Omit for all endpoints.'
        required: false
        description: 'Filter by static eligibility for x402 payment (`POST /x402/v1/run`): `true` keeps only payable endpoints, `false` only non-payable ones. Omit for all endpoints.'
        name: supportsX402
        in: query
      - schema:
          type: string
          minLength: 1
          maxLength: 100
          description: Narrow to endpoints payable via x402 on this customer-payment network (CAIP-2 id, e.g. `eip155:8453`). Implies `supportsX402=true`; an unknown/unconfigured id returns an empty page.
          example: eip155:8453
        required: false
        description: Narrow to endpoints payable via x402 on this customer-payment network (CAIP-2 id, e.g. `eip155:8453`). Implies `supportsX402=true`; an unknown/unconfigured id returns an empty page.
        name: x402Network
        in: query
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
          description: 'Filter by whether running the endpoint can change your workspace resources (phone numbers, files, asset libraries): `true` keeps only endpoints that cannot create, modify or delete them, `false` only endpoints that can. Omit for all endpoints. This describes RESOURCE effects only — a readonly endpoint may still perform real-world actions and is still billed.'
        required: false
        description: 'Filter by whether running the endpoint can change your workspace resources (phone numbers, files, asset libraries): `true` keeps only endpoints that cannot create, modify or delete them, `false` only endpoints that can. Omit for all endpoints. This describes RESOURCE effects only — a readonly endpoint may still perform real-world actions and is still billed.'
        name: readonly
        in: query
      - schema:
          type: string
          description: 'Keep only endpoints whose run can have AT LEAST ONE of the named effects on your workspace resources (phone numbers, files, asset libraries): `creates`, `updates`, `deletes`. Omit for all endpoints. Takes precedence over `readonly` (`readonly=true` is the alias for "no write effects"). Resource effects only — an endpoint with no effect may still perform real-world actions and is still billed.'
          example: creates,deletes
        required: false
        description: 'Keep only endpoints whose run can have AT LEAST ONE of the named effects on your workspace resources (phone numbers, files, asset libraries): `creates`, `updates`, `deletes`. Omit for all endpoints. Takes precedence over `readonly` (`readonly=true` is the alias for "no write effects"). Resource effects only — an endpoint with no effect may still perform real-world actions and is still billed.'
        name: effects
        in: query
      - schema:
          type: string
          minLength: 1
          maxLength: 200
          description: Optional free-text query — BM25 keyword ranking over the endpoint catalog (endpoint copy, provider names, category names). Combinable with `category`.
          example: twitter scraper
        required: false
        description: Optional free-text query — BM25 keyword ranking over the endpoint catalog (endpoint copy, provider names, category names). Combinable with `category`.
        name: q
        in: query
      - schema:
          type: string
          maxLength: 60
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Category node id to filter by (top group, leaf category, or provider node id from `GET /public/v1/categories`).
          example: twitter
        required: false
        description: Category node id to filter by (top group, leaf category, or provider node id from `GET /public/v1/categories`).
        name: category
        in: query
      - schema:
          type: string
          minLength: 1
          description: Provider slug to narrow to (exact match). Combinable with `q` and `category`; an unknown slug returns an empty page.
          example: exa
        required: false
        description: Provider slug to narrow to (exact match). Combinable with `q` and `category`; an unknown slug returns an empty page.
        name: provider
        in: query
      responses:
        '200':
          description: Endpoints page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicEndpointInfo'
                  cursor:
                    type: string
                    description: Opaque cursor for the next page. Absent on the last page.
                  total:
                    type: integer
                    minimum: 0
                    description: Total number of enabled endpoints matching the underlying query, irrespective of pagination.
                required:
                - items
        '400':
          description: Bad request — input failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getPublicV1Endpoints
      x-operation-id-source: derived
  /public/v1/providers:
    get:
      tags:
      - Public Registry
      summary: List providers
      description: Cursor-paginated list of providers with their enabled-endpoint counts. Pass `q` to re-scope counts to matching endpoints.
      parameters:
      - schema:
          type: integer
          exclusiveMinimum: 0
          description: Max items per page (server-side cap applies).
          example: 20
        required: false
        description: Max items per page (server-side cap applies).
        name: limit
        in: query
      - schema:
          type: string
          description: Cursor returned by the previous page.
        required: false
        description: Cursor returned by the previous page.
        name: cursor
        in: query
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
          description: 'Filter by static eligibility for x402 payment (`POST /x402/v1/run`): `true` keeps only payable endpoints, `false` only non-payable ones. Omit for all endpoints.'
        required: false
        description: 'Filter by static eligibility for x402 payment (`POST /x402/v1/run`): `true` keeps only payable endpoints, `false` only non-payable ones. Omit for all endpoints.'
        name: supportsX402
        in: query
      - schema:
          type: string
          minLength: 1
          maxLength: 100
          description: Narrow to endpoints payable via x402 on this customer-payment network (CAIP-2 id, e.g. `eip155:8453`). Implies `supportsX402=true`; an unknown/unconfigured id returns an empty page.
          example: eip155:8453
        required: false
        description: Narrow to endpoints payable via x402 on this customer-payment network (CAIP-2 id, e.g. `eip155:8453`). Implies `supportsX402=true`; an unknown/unconfigured id returns an empty page.
        name: x402Network
        in: query
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
          description: 'Filter by whether running the endpoint can change your workspace resources (phone numbers, files, asset libraries): `true` keeps only endpoints that cannot create, modify or delete them, `false` only endpoints that can. Omit for all endpoints. This describes RESOURCE effects only — a readonly endpoint may still perform real-world actions and is still billed.'
        required: false
        description: 'Filter by whether running the endpoint can change your workspace resources (phone numbers, files, asset libraries): `true` keeps only endpoints that cannot create, modify or delete them, `false` only endpoints that can. Omit for all endpoints. This describes RESOURCE effects only — a readonly endpoint may still perform real-world actions and is still billed.'
        name: readonly
        in: query
      - schema:
          type: string
          description: 'Keep only endpoints whose run can have AT LEAST ONE of the named effects on your workspace resources (phone numbers, files, asset libraries): `creates`, `updates`, `deletes`. Omit for all endpoints. Takes precedence over `readonly` (`readonly=true` is the alias for "no write effects"). Resource effects only — an endpoint with no effect may still perform real-world actions and is still billed.'
          example: creates,deletes
        required: false
        description: 'Keep only endpoints whose run can have AT LEAST ONE of the named effects on your workspace resources (phone numbers, files, asset libraries): `creates`, `updates`, `deletes`. Omit for all endpoints. Takes precedence over `readonly` (`readonly=true` is the alias for "no write effects"). Resource effects only — an endpoint with no effect may still perform real-world actions and is still billed.'
        name: effects
        in: query
      - schema:
          type: string
          minLength: 1
          maxLength: 200
          description: Optional free-text query. Counts become matching-endpoint counts (the same lexical matching as the endpoint search, aggregated by provider); providers with zero matches are omitted.
          example: twitter scraper
        required: false
        description: Optional free-text query. Counts become matching-endpoint counts (the same lexical matching as the endpoint search, aggregated by provider); providers with zero matches are omitted.
        name: q
        in: query
      responses:
        '200':
          description: Providers page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicProviderEntry'
                  cursor:
                    type: string
                    description: Opaque cursor for the next page. Absent on the last page.
                required:
                - items
        '400':
          description: Bad request — input failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getPublicV1Providers
      x-operation-id-source: derived
  /public/v1/resources:
    get:
      tags:
      - Public Registry
      summary: List provider resources
      description: The resources providers offer (e.g. a machine, an inbox, a phone number) with display copy, prices (recurring rent and metered usage rates) and the endpoints that operate on them. Filter by `category` and/or `provider`.
      parameters:
      - schema:
          type: string
          maxLength: 60
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Category node id to filter by (top group, leaf category, or provider node id from `GET /public/v1/categories`).
          example: virtual-machines
        required: false
        description: Category node id to filter by (top group, leaf category, or provider node id from `GET /public/v1/categories`).
        name: category
        in: query
      - schema:
          type: string
          minLength: 1
          maxLength: 200
          description: Exact provider slug.
          example: smolmachine
        required: false
        description: Exact provider slug.
        name: provider
        in: query
      responses:
        '200':
          description: Matching resources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderResourcesResponse'
        '400':
          description: Bad request — input failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getPublicV1Resources
      x-operation-id-source: derived
  /public/v1/providers/{provider}/endpoints/{endpoint}:
    get:
      tags:
      - Public Registry
      summary: Get one endpoint
      description: Fetch a single public endpoint card. `endpoint` is the endpoint path and may itself contain slashes (e.g. `apidojo/tweet-scraper`).
      parameters:
      - schema:
          type: string
          example: apify
        required: true
        name: provider
        in: path
      - schema:
          type: string
          description: Endpoint path; may contain slashes.
          example: apidojo/tweet-scraper
        required: true
        description: Endpoint path; may contain slashes.
        name: endpoint
        in: path
      responses:
        '200':
          description: Endpoint detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEndpointDetail'
        '404':
          description: Endpoint not found (missing or disabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getPublicV1ProvidersByProviderEndpointsByEndpoint
      x-operation-id-source: derived
components:
  schemas:
    TopCategoryNode:
      type: object
      properties:
        id:
          type: string
          description: Stable node id (e.g. "social-media", "twitter", "apify").
        displayName:
          type: string
          description: Display label — manifest copy for tops/leaves; resolved provider display name for provider nodes.
        description:
          type: string
          description: Short blurb, when available.
        endpointCount:
          type: integer
          minimum: 0
          description: 'Live endpoint count (with `q`: endpoints matching the query). Top counts are DISTINCT-document counts across their members.'
        kind:
          type: string
          enum:
          - top
          description: System group node.
        children:
          type: array
          items:
            type: string
          description: Ordered member node ids (linked leaves in display order, then provider nodes).
      required:
      - id
      - displayName
      - endpointCount
      - kind
      - children
    ProviderResourcesResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProviderResource'
      required:
      - items
    PublicRegistryStats:
      type: object
      properties:
        endpointCount:
          type: integer
          minimum: 0
        providerCount:
          type: integer
          minimum: 0
      required:
      - endpointCount
      - providerCount
    PublicEndpointInfo:
      type: object
      properties:
        provider:
          type: string
          description: Provider slug.
          example: exa
        providerDisplayName:
          type: string
          description: Resolved provider display name (curation > slug).
        providerDisplayDescription:
          type: string
          description: Resolved provider display blurb.
        endpoint:
          type: string
          description: Endpoint path.
          example: /search
        displayName:
          type: string
          description: Resolved endpoint display label. Always populated.
        displayDescription:
          type: string
          description: Resolved endpoint display blurb. May be empty.
        price:
          $ref: '#/components/schemas/PublicPrice'
        tags:
          type: array
          items:
            type: string
          description: User-facing tags (e.g. `["verified"]`). Always an array; empty when no tags are set on the indexed wrapper.
        categories:
          type: array
          items:
            type: string
          description: Depth-2 category paths — authored functional paths AND derived provider placement paths (e.g. `["social-media/twitter", "scrapers/apify"]`), treated uniformly. Bare top-level ancestors are excluded. Empty when the endpoint is outside the category catalog.
        supportedX402Networks:
          type: array
          items:
            type: string
          description: Customer-payment networks (CAIP-2 ids, e.g. `["eip155:8453", "eip155:143"]`) this endpoint can be paid for through `POST /x402/v1/run`. Empty when the endpoint is not x402-eligible (workspace-resource coupling, cost accrual, settlement-window fit, or visibility). Static protocol/policy compatibility — network availability and request/payment validation are checked at execution time.
      required:
      - provider
      - providerDisplayName
      - endpoint
      - displayName
      - displayDescription
      - price
      - tags
      - categories
      - supportedX402Networks
    ResourceEndpoint:
      type: object
      properties:
        endpoint:
          type: string
          example: /machines
        displayName:
          type: string
          example: Create machine
        price:
          $ref: '#/components/schemas/PublicPrice'
        effects:
          type: array
          items:
            type: string
            enum:
            - create
            - read
            - update
            - delete
          description: What this endpoint does to the resource (derived from the endpoint's resource lifecycle).
          example:
          - create
      required:
      - endpoint
      - displayName
      - price
      - effects
    PublicCategoryNode:
      oneOf:
      - $ref: '#/components/schemas/TopCategoryNode'
      - $ref: '#/components/schemas/LeafCategoryNode'
      - $ref: '#/components/schemas/ProviderCategoryNode'
      discriminator:
        propertyName: kind
        mapping:
          top: '#/components/schemas/TopCategoryNode'
          category: '#/components/schemas/LeafCategoryNode'
          provider: '#/components/schemas/ProviderCategoryNode'
    ProviderCategoryNode:
      type: object
      properties:
        id:
          type: string
          description: Stable node id (e.g. "social-media", "twitter", "apify").
        displayName:
          type: string
          description: Display label — manifest copy for tops/leaves; resolved provider display name for provider nodes.
        description:
          type: string
          description: Short blurb, when available.
        endpointCount:
          type: integer
          minimum: 0
          description: 'Live endpoint count (with `q`: endpoints matching the query). Top counts are DISTINCT-document counts across their members.'
        kind:
          type: string
          enum:
          - provider
          description: Derived provider node.
        provider:
          type: string
          description: Provider slug.
        url:
          type: string
          format: uri
          description: 'The provider''s own public website, when it declares one (`ProviderInfo.url`). Absent otherwise — never null, never empty. Provider nodes only: a leaf/top category has no vendor to link to. This is display copy, NOT the endpoint-level documentation URL (`docUrl`).'
          example: https://context.dev
        docsUrl:
          type: string
          format: uri
          description: The provider's own API documentation, when known (`ProviderInfo.docsUrl`). Provider nodes only; absent otherwise.
          example: https://docs.context.dev
        parents:
          type: array
          items:
            type: string
          description: Top ids this provider node is linked under (a node may have several parents).
      required:
      - id
      - displayName
      - endpointCount
      - kind
      - provider
      - parents
    ProviderResource:
      type: object
      properties:
        provider:
          type: string
          example: smolmachine
        providerDisplayName:
          type: string
          example: Smol Machines
        providerUrl:
          type: string
          format: uri
          description: The provider's website, when known.
        providerDocsUrl:
          type: string
          format: uri
          description: The provider's API docs, when known.
        resource:
          type: string
          description: Resource slug — unique with `provider`.
          example: SmolmachineMachine
        resourceType:
          type: string
          example: machine
        displayName:
          type: string
          example: Virtual machine
        displayDescription:
          type: string
        summary:
          type: string
        pricing:
          type: object
          properties:
            rent:
              $ref: '#/components/schemas/ResourceRent'
            rateCard:
              type: array
              items:
                $ref: '#/components/schemas/ResourceRateLine'
              description: Metered usage rates (empty when the resource is not usage-billed).
            firstPeriodChargedAtCreation:
              type: boolean
              description: True when the call that creates the resource charges the first rent period (so the rent is not charged twice).
          required:
          - rent
          - rateCard
          - firstPeriodChargedAtCreation
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/ResourceEndpoint'
          description: The endpoints that operate on this resource and are visible to the caller, with what each does to it.
        categories:
          type: array
          items:
            type: string
          description: Category node ids — the union of those endpoints' categories.
      required:
      - provider
      - providerDisplayName
      - resource
      - resourceType
      - displayName
      - displayDescription
      - summary
      - pricing
      - endpoints
      - categories
    ResourceRateLine:
      type: object
      properties:
        label:
          type: string
          example: cpu
        ratePerUnit:
          type: number
