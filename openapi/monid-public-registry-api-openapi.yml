    LeafCategoryNode:
      type: object
      properties:
        id:
          type: string
          description: Stable node id (e.g. "social-media", "twitter", "apify").
        displayName:
          type: string
          description: Display label — manifest copy for tops/leaves; resolved provider display name for provider nodes.
        description:
          type: string
          description: Short blurb, when available.
        endpointCount:
          type: integer
          minimum: 0
          description: 'Live endpoint count (with `q`: endpoints matching the query). Top counts are DISTINCT-document counts across their members.'
        kind:
          type: string
          enum:
          - category
          description: Leaf category node.
        parents:
          type: array
          items:
            type: string
          description: Top ids this leaf is linked under (a leaf may have several parents).
      required:
      - id
      - displayName
      - endpointCount
      - kind
      - parents
    PublicEndpointDetail:
      allOf:
      - $ref: '#/components/schemas/PublicEndpointInfo'
      - type: object
        properties:
          summary:
            type: string
            description: Rich long-form endpoint detail, when authored.
          method:
            type: string
            description: HTTP method for this endpoint.
          docUrl:
            type: string
            format: uri
            description: The vendor's docs page for this endpoint, when known.
          hints:
            type: object
            additionalProperties: {}
            description: Raw structured agent-guidance hints (phrase → target), when authored on the endpoint. Cross-links related endpoints in multi-step workflows.
    PublicProviderEntry:
      type: object
      properties:
        provider:
          type: string
          description: Provider slug.
        displayName:
          type: string
          description: Resolved display label (curation > slug).
        displayDescription:
          type: string
        url:
          type: string
          format: uri
          description: Provider's public website. Absent when the provider declares none — never null, never empty. NOT the endpoint-level documentation URL (`docUrl`), which is served only on the endpoint detail and `POST /v1/inspect`.
          example: https://context.dev
        docsUrl:
          type: string
          format: uri
          description: Provider's own API documentation, when known. Absent otherwise — never null, never empty.
        endpointCount:
          type: integer
          minimum: 0
          description: Number of currently-enabled endpoints.
      required:
      - provider
      - displayName
      - endpointCount
