    ResourceEndpoint:
      type: object
      properties:
        endpoint:
          type: string
          example: /machines
        displayName:
          type: string
          example: Create machine
        price:
          $ref: '#/components/schemas/PublicPrice'
        effects:
          type: array
          items:
            type: string
            enum:
            - create
            - read
            - update
            - delete
          description: What this endpoint does to the resource (derived from the endpoint's resource lifecycle).
          example:
          - create
