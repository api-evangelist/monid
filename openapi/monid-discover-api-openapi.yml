      - price
      - effects
    DiscoverRequest:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 1000
          description: Natural-language search query for data endpoints.
          example: twitter posts
        limit:
          type: integer
          exclusiveMinimum: 0
          default: 5
          description: Requested result count. A config-driven server-side cap (`api-config` `discover.maxResults`) applies.
          example: 5
        minScore:
          type: number
          minimum: 0
          maximum: 2
          description: Per-call override for the post-rerank score floor. Results scoring below this are filtered out before truncation to `limit`. Falls back to the configured default when omitted.
          example: 0.2
        includeUnavailable:
          type: boolean
          default: false
          description: 'Endpoints currently in outage are hidden by default (the page is back-filled from the next ranked candidates). Set true to include them — marked `metrics.status: "outage"` and ranked last.'
          example: false
        supportsX402:
          type: boolean
          description: 'Filter by static eligibility for x402 payment (`POST /x402/v1/run`): `true` keeps only payable endpoints, `false` only non-payable ones. Omit for all endpoints. Network availability and request/payment validation are checked at execution time.'
        x402Network:
          type: string
          minLength: 1
          maxLength: 100
          description: Narrow to endpoints payable via x402 on this customer-payment network (CAIP-2 id, e.g. `eip155:8453`). Implies `supportsX402=true`; an unknown/unconfigured id returns an empty page.
          example: eip155:8453
        readonly:
          type: boolean
          description: 'Filter by whether running the endpoint can change your workspace resources (phone numbers, files, asset libraries): `true` keeps only endpoints that cannot create, modify or delete them, `false` only endpoints that can. Omit for all endpoints. This describes RESOURCE effects only — a readonly endpoint may still perform real-world actions and is still billed.'
        effects:
          type: array
          items:
            type: string
            enum:
            - creates
            - updates
            - deletes
          minItems: 1
          description: 'Keep only endpoints whose run can have AT LEAST ONE of the named effects on your workspace resources (phone numbers, files, asset libraries): `creates`, `updates`, `deletes`. Omit for all endpoints. Takes precedence over `readonly` (`readonly=true` is the alias for "no write effects"). Resource effects only — an endpoint with no effect may still perform real-world actions and is still billed.'
          example:
          - creates
          - deletes
      required:
      - query
