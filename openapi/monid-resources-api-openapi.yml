  /v1/resources/{resourceId}/files/download-url:
    get:
      tags:
      - Resources
      summary: Get a file download URL
      description: Returns `{ url, expiresAt }` — a short-lived signed URL for the file at `path` on a workspace file system; GET it to stream the bytes. Pass `redirect=true` for a 302 straight to the URL (`curl -L`). For a shareable URL with a longer TTL, run the provider's /cat endpoint.
      security:
      - Bearer: []
      parameters:
      - schema:
          type: string
          description: Resource identifier (ULID).
        required: true
        description: Resource identifier (ULID).
        name: resourceId
        in: path
      - schema:
          type: string
          minLength: 1
          description: File path relative to the FS root.
        required: true
        description: File path relative to the FS root.
        name: path
        in: query
      - schema:
          type: string
          enum:
          - 'true'
          description: '`true` answers a 302 redirect to the signed URL instead of the JSON body (the `curl -L` ergonomic).'
        required: false
        description: '`true` answers a 302 redirect to the signed URL instead of the JSON body (the `curl -L` ergonomic).'
        name: redirect
        in: query
      responses:
        '200':
          description: The signed download URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  expiresAt:
                    type: string
                required:
                - url
                - expiresAt
        '302':
          description: Redirect to the signed URL (`redirect=true`)
        '401':
          description: Unauthorized — missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — caller has no workspace or no access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource or path not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (errorCode `RATE_LIMITED`) — the `Retry-After` header carries whole seconds until the caller may retry; `RateLimit-Limit/-Remaining/-Reset` and `X-RateLimit-Rule` name the binding rule (also sent on allowed responses that matched a rule; responses that matched no rule, or an `unlimited` exemption, carry none of them). Applies to every authenticated `/v1` route (per API key / user / origin / workspace); POST /v1/run additionally enforces per-provider/endpoint run limits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getV1ResourcesByResourceIdFilesDownloadUrl
      x-operation-id-source: derived
  /v1/resources/{resourceId}/files:
    get:
      tags:
      - Resources
      summary: List file-system entries
      description: List the entries of a workspace file system (file_system resources only). One directory level per call — pass `recursive` for the whole subtree. Cursor-paginated.
      security:
      - Bearer: []
      parameters:
      - schema:
          type: string
          description: Resource identifier (ULID).
        required: true
        description: Resource identifier (ULID).
        name: resourceId
        in: path
      - schema:
          type: string
          description: Directory (or file) to list. Omit for the root.
        required: false
        description: Directory (or file) to list. Omit for the root.
        name: path
        in: query
      - schema:
          type:
          - boolean
          - 'null'
        required: false
        name: recursive
        in: query
      - schema:
          type: string
        required: false
        name: cursor
        in: query
      - schema:
          type: integer
          exclusiveMinimum: 0
          maximum: 1000
        required: false
        name: limit
        in: query
      responses:
        '200':
          description: File-system entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                          description: Path relative to the FS root.
                        type:
                          type: string
                          enum:
                          - file
                          - dir
                        sizeBytes:
                          type: integer
                        lastModified:
                          type: string
                          description: ISO-8601 last-modified timestamp (files only).
                      required:
                      - path
                      - type
                  cursor:
                    type: string
                    description: Opaque cursor — present when more entries exist.
                required:
                - items
        '401':
          description: Unauthorized — missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — caller has no workspace or no access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (errorCode `RATE_LIMITED`) — the `Retry-After` header carries whole seconds until the caller may retry; `RateLimit-Limit/-Remaining/-Reset` and `X-RateLimit-Rule` name the binding rule (also sent on allowed responses that matched a rule; responses that matched no rule, or an `unlimited` exemption, carry none of them). Applies to every authenticated `/v1` route (per API key / user / origin / workspace); POST /v1/run additionally enforces per-provider/endpoint run limits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getV1ResourcesByResourceIdFiles
      x-operation-id-source: derived
  /v1/resources/{resourceId}/mint-assets/download-url:
    get:
      tags:
      - Resources
      summary: Get an asset file's download URL
      description: Returns `{ url }` — a freshly minted download URL for one file of one library asset; GET it to stream the bytes. The provider's URLs are short-lived and never stored, so call this each time you need one. Pass `redirect=true` for a 302 straight to the URL (`curl -L`). `format` must be one of the `format` values from `/mint-assets/files`.
      security:
      - Bearer: []
      parameters:
      - schema:
          type: string
          description: Resource identifier (ULID).
        required: true
        description: Resource identifier (ULID).
        name: resourceId
        in: path
      - schema:
          type: string
          minLength: 1
          description: Asset id from the library listing.
        required: true
        description: Asset id from the library listing.
        name: assetId
        in: query
      - schema:
          type: string
          minLength: 1
          description: A `format` from `/mint-assets/files` (e.g. `glb`).
        required: true
        description: A `format` from `/mint-assets/files` (e.g. `glb`).
        name: format
        in: query
      - schema:
          type: string
          enum:
          - 'true'
          description: '`true` answers a 302 redirect to the URL instead of the JSON body (the `curl -L` ergonomic).'
        required: false
        description: '`true` answers a 302 redirect to the URL instead of the JSON body (the `curl -L` ergonomic).'
        name: redirect
        in: query
      responses:
        '200':
          description: The download URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                required:
                - url
        '302':
          description: Redirect to the URL (`redirect=true`)
        '400':
          description: Missing 'assetId' or 'format' query param
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized — missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — caller has no workspace or no access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource, asset or format not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (errorCode `RATE_LIMITED`) — the `Retry-After` header carries whole seconds until the caller may retry; `RateLimit-Limit/-Remaining/-Reset` and `X-RateLimit-Rule` name the binding rule (also sent on allowed responses that matched a rule; responses that matched no rule, or an `unlimited` exemption, carry none of them). Applies to every authenticated `/v1` route (per API key / user / origin / workspace); POST /v1/run additionally enforces per-provider/endpoint run limits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getV1ResourcesByResourceIdMintAssetsDownloadUrl
      x-operation-id-source: derived
  /v1/resources/{resourceId}/mint-assets/files:
    get:
      tags:
      - Resources
      summary: List an asset's downloadable files
      description: Returns every file one library asset currently has, each with a freshly minted download URL — GET a `url` to stream the bytes. One upstream read, so this reflects the provider's present truth; an asset with nothing downloadable answers an empty list.
      security:
      - Bearer: []
      parameters:
      - schema:
          type: string
          description: Resource identifier (ULID).
        required: true
        description: Resource identifier (ULID).
        name: resourceId
        in: path
      - schema:
          type: string
          minLength: 1
          description: Asset id from the library listing.
        required: true
        description: Asset id from the library listing.
        name: assetId
        in: query
      responses:
        '200':
          description: The asset's downloadable files
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        format:
                          type: string
                          description: Stable file name — pass it to `/mint-assets/download-url` (e.g. `glb`, `spz-500k`, `basecolor`).
                        url:
                          type: string
                          description: Freshly minted download URL. Short-lived and never stored — ask again rather than keeping it.
                      required:
                      - format
                      - url
                required:
                - items
        '401':
          description: Unauthorized — missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — caller has no workspace or no access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource or asset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (errorCode `RATE_LIMITED`) — the `Retry-After` header carries whole seconds until the caller may retry; `RateLimit-Limit/-Remaining/-Reset` and `X-RateLimit-Rule` name the binding rule (also sent on allowed responses that matched a rule; responses that matched no rule, or an `unlimited` exemption, carry none of them). Applies to every authenticated `/v1` route (per API key / user / origin / workspace); POST /v1/run additionally enforces per-provider/endpoint run limits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getV1ResourcesByResourceIdMintAssetsFiles
      x-operation-id-source: derived
  /v1/resources/{resourceId}/mint-assets:
    get:
      tags:
      - Resources
      summary: List asset-library contents
      description: List the assets in a workspace's asset library (`asset_library` resources only), newest first. Cursor-paginated. Filter by `assetType` to show one kind.
      security:
      - Bearer: []
      parameters:
      - schema:
          type: string
          description: Resource identifier (ULID).
        required: true
        description: Resource identifier (ULID).
        name: resourceId
        in: path
      - schema:
          type: string
