          - orbit
          - cloro
          - topaz
          - search1api
          - magichour
          - keenable
          description: Filter by provider slug (e.g. 'saperly').
        required: false
        description: Filter by provider slug (e.g. 'saperly').
        name: provider
        in: query
      - schema:
          type: string
          enum:
