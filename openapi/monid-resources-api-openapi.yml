openapi: 3.2.0
info:
  title: Monid Resources API
  version: 0.1.0
  description: Agentic payment platform for data — agents discover and buy data on demand. Authenticated `/v1/*` routes accept a Monid API key or Clerk JWT as a Bearer token. All errors return `{ code, message }`. List endpoints use cursor pagination; consult each operation schema for its last-page cursor encoding.
servers:
- url: https://api.monid.ai
  description: Production
- url: https://monid.ai
  description: Public registry alias (public/v1 only)
tags:
- name: Resources
paths:
  /v1/resources:
    get:
      tags:
      - Resources
      summary: List resources
      description: 'Cursor-paginated list of the workspace''s provider resources (durable, workspace-owned provider assets, e.g. phone numbers), newest first. Optional `provider`/`resourceType`/`state` filters (`resourceType` requires `provider`). Three listing modes: by default the page holds TOP-LEVEL resources only; `includeChildren=true` lists everything (children included) in one flat page; `parent=` lists ONLY that resource''s children.'
      security:
      - Bearer: []
      parameters:
      - schema:
          type: integer
          exclusiveMinimum: 0
          maximum: 100
          description: Max items per page (server-side cap applies).
        required: false
        description: Max items per page (server-side cap applies).
        name: limit
        in: query
      - schema:
          type: string
          description: Cursor returned by the previous page.
        required: false
        description: Cursor returned by the previous page.
        name: cursor
        in: query
      - schema:
          type: string
          enum:
          - apify
          - pdl
          - opoint
          - tikhub
          - exa
          - minimax
          - bytedance
          - suzanne
          - akta
          - saperly
          - apollo
          - censusdata.xyz
          - defillama
          - sfs
          - semrush
          - elevenlabs
          - octen
          - mint
          - context.dev
          - surf
          - agentmail
          - ahrefs
          - tinyfish
          - firecrawl
          - massive
          - hunterio
          - contactout
          - clay
          - alibaba
          - mrscraper
          - fundable
          - ploid
          - smolmachine
          - kling
          - recall
          - gemini
          - tendata
          - openai
          - vaquill
          - litescrape
          - typesafe
          - dataforseo
          - orbit
          - cloro
          - topaz
          - search1api
          - magichour
          - keenable
          description: Filter by provider slug (e.g. 'saperly').
        required: false
        description: Filter by provider slug (e.g. 'saperly').
        name: provider
        in: query
      - schema:
          type: string
          enum:
          - phone_number
          - file_system
          - asset_library
          - machine
          - email_account
          - email_inbox
          - email_domain
          - browser_session
          - browser_profile
          description: Filter by resource type — requires `provider` (store SK prefix is ordered).
        required: false
        description: Filter by resource type — requires `provider` (store SK prefix is ordered).
        name: resourceType
        in: query
      - schema:
          type: string
          enum:
          - READY
          - PROVISIONING
          - ACTIVE
          - EXPIRING
          - SUSPENDED
          - RELEASED
          - PROVISION_FAILED
          description: Filter by lifecycle state.
        required: false
        description: Filter by lifecycle state.
        name: state
        in: query
      - schema:
          type: string
          minLength: 1
          description: List ONLY the children of this resource (e.g. an email account's inboxes) instead of the workspace's top-level resources. 404 when the resource is not yours. Mutually exclusive with `includeChildren`.
        required: false
        description: List ONLY the children of this resource (e.g. an email account's inboxes) instead of the workspace's top-level resources. 404 when the resource is not yours. Mutually exclusive with `includeChildren`.
        name: parent
        in: query
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
          description: 'Include child resources (e.g. the inboxes inside an email account) in the flat workspace listing. Default: top-level resources only. Mutually exclusive with `parent`.'
        required: false
        description: 'Include child resources (e.g. the inboxes inside an email account) in the flat workspace listing. Default: top-level resources only. Mutually exclusive with `parent`.'
        name: includeChildren
        in: query
      responses:
        '200':
          description: Resources page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Resource'
                  cursor:
                    type: string
                    description: Opaque cursor for the next page; absent on the last page.
                required:
                - items
        '400':
          description: Bad request — input failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized — missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — caller has no workspace or no access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Parent resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (errorCode `RATE_LIMITED`) — the `Retry-After` header carries whole seconds until the caller may retry; `RateLimit-Limit/-Remaining/-Reset` and `X-RateLimit-Rule` name the binding rule (also sent on allowed responses that matched a rule; responses that matched no rule, or an `unlimited` exemption, carry none of them). Applies to every authenticated `/v1` route (per API key / user / origin / workspace); POST /v1/run additionally enforces per-provider/endpoint run limits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getV1Resources
      x-operation-id-source: derived
  /v1/resources/{resourceId}/external/{kind}:
    get:
      tags:
      - Resources
      summary: Get a resource's live external detail
      description: Live detail of one external kind (from the resource's `externalResources` summaries), fetched fresh from the provider and sanitized — never secrets or upstream ids. Nothing is persisted; the response is upstream truth at this moment.
      security:
      - Bearer: []
      parameters:
      - schema:
          type: string
          description: Resource identifier (ULID).
        required: true
        description: Resource identifier (ULID).
        name: resourceId
        in: path
      - schema:
          type: string
          description: External kind (from `externalResources[].kind`).
        required: true
        description: External kind (from `externalResources[].kind`).
        name: kind
        in: path
      responses:
        '200':
          description: Live external detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalResourceDetail'
        '401':
          description: Unauthorized — missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — caller has no workspace or no access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource (or external kind) not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (errorCode `RATE_LIMITED`) — the `Retry-After` header carries whole seconds until the caller may retry; `RateLimit-Limit/-Remaining/-Reset` and `X-RateLimit-Rule` name the binding rule (also sent on allowed responses that matched a rule; responses that matched no rule, or an `unlimited` exemption, carry none of them). Applies to every authenticated `/v1` route (per API key / user / origin / workspace); POST /v1/run additionally enforces per-provider/endpoint run limits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: The provider could not be reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getV1ResourcesByResourceIdExternalByKind
      x-operation-id-source: derived
