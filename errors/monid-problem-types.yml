source: https://monid.ai/docs/api/overview.md (Error Codes + Response Format) + https://monid.ai/docs/guide/pay-with-x402.md
format: json
envelope:
  content_type: application/json
  shape: '{ "code": <int http status>, "message": "<string>" }'
  note: Flat envelope, not RFC 9457 problem+json; code duplicates the HTTP status. Every response carries an x-request-id
    header to quote when reporting issues.
problems:
- status: 400
  title: Bad request
  type: null
  description: invalid input, malformed JSON, or validation error
  remediation: Validate the input against the schema returned by postV1Inspect.
- status: 401
  title: Unauthorized
  type: null
  description: missing or invalid API key
  remediation: 'Send Authorization: Bearer <Monid API key or OAuth access token>.'
- status: 402
  title: Payment required
  type: null
  description: insufficient wallet balance
  remediation: Top up the workspace wallet (getV1WalletTopup / postV1WalletTopupSessions) or pay per run via x402,
    then retry.
- status: 403
  title: Forbidden
  type: null
  description: key is valid but not associated with a workspace, or the resource belongs to another workspace
  remediation: Use a key bound to the workspace, or pass x-workspace-id with an OAuth token lacking org context.
- status: 404
  title: Not found
  type: null
  description: resource doesn't exist
  remediation: Check the provider/endpoint pair with postV1Discover or getPublicV1Endpoints.
- status: 408
  title: Request timeout
  type: null
  description: a synchronous run timed out (TIMED_OUT)
  remediation: Run asynchronously and poll getV1RunsByRunId instead of blocking.
- status: 409
  title: Conflict
  type: null
  description: e.g. stopping a run that is terminal or not stoppable
  remediation: Read the run state with getV1RunsByRunId before stopping; only READY/RUNNING runs can be stopped.
- status: 500
  title: Internal server error
  type: null
  description: internal server error
  remediation: Retry later and report the x-request-id to support@monid.ai.
- status: 502
  title: Bad gateway
  type: null
  description: the upstream provider rejected the call (e.g. provider-side payment error)
  remediation: Inspect the provider error in the run body; the upstream provider, not Monid, rejected the call.
- status: 503
  title: Service unavailable
  type: null
  description: e.g. the wallet is not active
  remediation: Activate the workspace wallet in the dashboard before running.
x402_surface:
- status: 402
  title: Payment Required
  description: x402.monid.ai advertises every supported network in its 402 accepts array; the client signs a USDC
    authorization and retries.
- status: 408
  title: TIMED_OUT
  description: Zero-billed on the x402 surface.
- status: 401
  title: signature invalid
  description: SIWX signature on GET /v1/runs/{runId} rejected.
- status: 403
  title: not the paying wallet
  description: The caller is not the wallet that paid for this run.
