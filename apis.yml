- aid: monid:monid-x402-run-api
  name: Monid x402 Run API
  description: Pay-per-run execution surface on x402.monid.ai — POST /v1/run answers HTTP 402 with an accepts[] array of CAIP-2 networks (Base
    eip155:8453, Monad eip155:143), the client signs a USDC authorization and retries, and GET /v1/runs/{runId} returns the result against a Sign-In-With-X
    signature from the paying wallet. No workspace, API key or prepaid balance is needed to run; discovery and inspection still use the keyed
    api.monid.ai surface. Minimum price $0.01 per run; metered endpoints are not available on x402.
  humanURL: https://monid.ai/docs/guide/pay-with-x402
  baseURL: https://x402.monid.ai
  tags:
  - x402
  - Payments
  - Agents
  properties:
  - type: Documentation
    url: https://monid.ai/docs/guide/pay-with-x402.md
