aid: monid
name: Monid
description: >-
  Monid is a San Francisco-based data-access and agent-tool integration platform that gives developers
  and AI agents on-demand, pay-per-use access to hundreds of web data endpoints and 1,300+ tools across
  13+ providers (Semrush, Apollo, ElevenLabs, web scrapers, and more) through a single integration.
  Agents discover, inspect, compare, and execute tools at runtime and pay only for actual usage, with a
  unified balance and no per-tool API key management or subscriptions. Monid exposes its catalog through
  four connection methods — an MCP (Model Context Protocol) server for Claude and other AI assistants, a
  Skill integration for Claude Code and Cursor, a CLI for shell access, and an HTTP API for programmatic
  integration — with OAuth, proxy, and master API key options for embedded use.
