name: Monid MCP Server
status: published
status_raw: hosted
transport: streamable-http
url: https://mcp.monid.ai/v1
auth: OAuth / Bearer (Monid API key)
description: Official hosted Monid MCP server (Streamable HTTP). Gives an AI client tools to discover, inspect,
  and run hundreds of data endpoints across the web, with pay-per-use billing against a Monid workspace balance.
install:
  claude-code: claude mcp add --transport http monid https://mcp.monid.ai/v1
  codex: codex mcp add monid --url https://mcp.monid.ai/v1
